<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford</title>

    <link href="css/reset.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/form.css" rel="stylesheet">

    <script src="js/form.js"></script>
</head>

<body>

    <header>
        <div>
            <img src="img/logo-ford-256.png" width="150" class="logo" />
        </div>

        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="lancamento.html">Lançamento</a>
                </li>

                <li>
                    <a href="contato.html">Contato</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="forms">

            <div>
                <img src="img/xls 2.2 diesel.jpg">
            </div>

            <div>

                <h2 class="titulo">
                    Sobre Você
                </h2>

                <form onsubmit="Post(this); return false;">

                    <input
                        type="text"
                        id="nomeid"
                        name="nome"
                        placeholder="NOME*"
                        class="fordform"
                        required
                    >

                    <input
                        type="text"
                        name="sobrenome"
                        placeholder="SOBRENOME*"
                        class="fordform"
                        required
                    >

                    <input
                        type="email"
                        name="email"
                        placeholder="E-MAIL*"
                        class="fordform"
                        required
                    >

                    <input
                        type="text"
                        name="cpf"
                        placeholder="CPF*"
                        class="fordform"
                        required
                    >

                    <input
                        type="tel"
                        name="telefone"
                        placeholder="TELEFONE*"
                        class="fordform"
                        required
                        oninvalid="this.setCustomValidity('Digite apenas números no telefone')"
                        oninput="this.setCustomValidity('')"
                        pattern="[0-9]+"
                    >

                    <select
                        name="contato"
                        class="fordform"
                        required
                    >

                        <option selected disabled>
                            COMO DESEJA SER CONTATADO?
                        </option>

                        <option>Elogio</option>

                        <option>Reclamação</option>

                        <option>Solicitação</option>

                    </select>

                    <textarea
                        name="mensagem"
                        class="fordform"
                        placeholder="MENSAGEM"
                        rows="3"
                        required
                    ></textarea>

                    <p class="lgpd-texto">
                        Os dados serão mantidos em nossa base de dados, só enquanto for desejado por você.
                        A qualquer momento, será possível editar ou remover tais dados.
                    </p>

                    <div class="checkbox-area">

                      <input type="checkbox" id="termos">

                        <label for="termos">
                            Sim. Li e concordo com os

                            <a
                                href="https://www.ford.com.br/politica-de-privacidade/"
                                target="_blank"
                            >
                                Termos e Condições
                            </a>
                        </label>

                    </div>

                    <br>

                    <div class="checkbox-area">

                        <input type="checkbox" id="novidades">

                        <label for="novidades">
                            Sim. Também quero receber descontos e novidades.
                        </label>

                    </div>

                    <br>

                  <button type="submit" id="btnEnviar">
                            Enviar
                  </button>

                </form>

            </div>

        </div>

    </main>

    <footer>

        <nav id="social" class="footer-right">

            <ul>

                <li>
                    <span class="redesociais">
                        Redes Sociais
                    </span>
                </li>

                <li>
                    <a href="#" title="Facebook">
                        <img src="img/facebook-50.png">
                    </a>
                </li>

                <li>
                    <a href="#" title="YouTube">
                        <img src="img/youtube-squared-50.png">
                    </a>
                </li>

                <li>
                    <a href="#" title="Instagram">
                        <img src="img/instagram-logo-50.png">
                    </a>
                </li>

            </ul>

        </nav>

        <div class="copyright">
            © 2026 Ford Motor Company - Todos os direitos reservados.
        </div>

        <div class="footer-logo">
            <img src="img/ford-96.png" width="70" />
        </div>

    </footer>

</body>
</html>
